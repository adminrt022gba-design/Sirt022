<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIRT 022</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0d6efd, #174ea6);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.18);
      text-align: center;
    }

    .login-logo {
      width: 105px;
      height: 105px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 18px;
    }

    .logo-fallback {
      width: 105px;
      height: 105px;
      margin: 0 auto 12px;
      border-radius: 20px;
      background: #0d6efd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
    }

    .login-title {
      font-size: 28px;
      font-weight: bold;
      color: #0d6efd;
    }

    .login-subtitle {
      margin-top: 6px;
      margin-bottom: 25px;
      color: #666;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-control {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d6dbe1;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
      background: white;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13,110,253,.1);
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      transition: .2s;
    }

    .btn-primary {
      background: #0d6efd;
      color: white;
    }

    .btn-primary:hover {
      background: #0b5ed7;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-success {
      background: #198754;
      color: white;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-light {
      background: #eef2f6;
      color: #333;
    }

    .btn-block {
      width: 100%;
    }

    .login-error {
      margin-top: 15px;
      padding: 11px;
      border-radius: 10px;
      background: #ffe5e5;
      color: #b00020;
      display: none;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    #appPage {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e8eb;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 12px;
    }

    .hamburger {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 11px;
      background: #eef4ff;
      color: #0d6efd;
      font-size: 24px;
      font-weight: bold;
    }

    .top-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 8px;
    }

    .top-title {
      font-weight: bold;
      font-size: 18px;
    }

    .top-subtitle {
      font-size: 11px;
      color: #777;
      margin-top: 2px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 150;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -290px;
      width: 275px;
      height: 100vh;
      background: white;
      z-index: 200;
      transition: left .25s ease;
      box-shadow: 8px 0 25px rgba(0,0,0,.15);
      overflow-y: auto;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar-header {
      padding: 22px 18px;
      background: #0d6efd;
      color: white;
    }

    .sidebar-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: white;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 10px;
    }

    .sidebar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .sidebar-user {
      font-size: 12px;
      margin-top: 5px;
      opacity: .9;
      word-break: break-word;
    }

    .menu-list {
      padding: 10px;
    }

    .menu-item {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 13px 14px;
      border-radius: 10px;
      margin-bottom: 4px;
      font-size: 14px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-item:hover,
    .menu-item.active {
      background: #eef4ff;
      color: #0d6efd;
    }

    .menu-icon {
      width: 24px;
      text-align: center;
      font-size: 18px;
    }

    .menu-divider {
      height: 1px;
      background: #e5e5e5;
      margin: 10px 4px;
    }

    /* =========================
       CONTENT
    ========================= */

    .main-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 15px 50px;
    }

    .page-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .page-description {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    /* =========================
       HOME
    ========================= */

    .welcome {
      background: linear-gradient(135deg, #0d6efd, #174ea6);
      color: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .welcome h2 {
      font-size: 23px;
      margin-bottom: 6px;
    }

    .welcome p {
      font-size: 14px;
      opacity: .9;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 17px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .stat-icon {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .stat-label {
      color: #777;
      font-size: 12px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 4px;
      color: #0d6efd;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f7f9fb;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-success {
      background: #dff6e8;
      color: #147a43;
    }

    .badge-warning {
      background: #fff0c7;
      color: #856404;
    }

    .badge-danger {
      background: #ffe0e3;
      color: #a61e2a;
    }

    /* =========================
       FORM GRID
    ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    /* =========================
       REPORT / ANNOUNCEMENT
    ========================= */

    .item-card {
      border: 1px solid #e7eaee;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 11px;
    }

    .item-card h4 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .item-meta {
      color: #888;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .item-content {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* =========================
       QRIS
    ========================= */

    .qris-box {
      text-align: center;
    }

    .qris-image {
      display: block;
      width: min(100%, 340px);
      margin: 15px auto;
      border-radius: 15px;
      border: 1px solid #ddd;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty {
      text-align: center;
      color: #888;
      padding: 30px 15px;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .alert-info {
      background: #e7f1ff;
      color: #1456a0;
    }

    .alert-success {
      background: #e2f7eb;
      color: #146c43;
    }

    .alert-danger {
      background: #ffe5e8;
      color: #a61e2a;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;
      color: #999;
      font-size: 11px;
      padding: 20px 10px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .page-title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- ==================================================
       LOGIN PAGE
  =================================================== -->

  <section id="loginPage">

  <!-- ==================================================
       JAVASCRIPT
  =================================================== -->

  <script>

    /* ==================================================
       SUPABASE
    =================================================== */

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );


    /* ==================================================
       GLOBAL
    =================================================== */

    let currentPage = "home";
    let editingWargaId = null;


    /* ==================================================
       UTILITIES
    =================================================== */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function formatTanggal(value) {

      if (!value) {
        return "-";
      }

      try {

        return new Date(value).toLocaleDateString(
          "id-ID",
          {
            day: "2-digit",
            month: "long",
            year: "numeric"
          }
        );

      } catch (e) {
        return value;
      }
    }


    function showMessage(
      message,
      type = "info"
    ) {

      const main = document.getElementById("mainContent");

      const className =
        type === "success"
          ? "alert-success"
          : type === "danger"
            ? "alert-danger"
            : "alert-info";

      const box = document.createElement("div");

      box.className = `alert ${className}`;
      box.innerText = message;

      main.prepend(box);

      setTimeout(() => {

        if (box.parentNode) {
          box.remove();
        }

      }, 3500);
    }


    /* ==================================================
       MENU
    =================================================== */

    function openMenu() {

      document
        .getElementById("sidebar")
        .classList.add("active");

      document
        .getElementById("menuOverlay")
        .classList.add("active");
    }


    function closeMenu() {

      document
        .getElementById("sidebar")
        .classList.remove("active");

      document
        .getElementById("menuOverlay")
        .classList.remove("active");
    }


    function setActiveMenu(page) {

      document
        .querySelectorAll(".menu-item[data-page]")
        .forEach(button => {

          button.classList.remove("active");

          if (button.dataset.page === page) {
            button.classList.add("active");
          }

        });
    }


    /* ==================================================
       PAGE ROUTER
    =================================================== */

    async function openPage(page) {

      currentPage = page;

      setActiveMenu(page);
      closeMenu();

      const pageNames = {

        home: "Beranda",
        warga: "Data Warga",
        pembayaran: "Pembayaran Bulanan",
        laporan: "Laporan / Usulan Warga",
        pengumuman: "Pengumuman",
        kegiatan: "Kegiatan",
        pengurus: "Pengurus RT",
        nomor: "Nomor Penting",
        pengaturan: "Pengaturan"

      };

      document.getElementById("topPageName").innerText =
        pageNames[page] || "SIRT 022";


      if (page === "home") {
        await showHome();
      }

      else if (page === "warga") {
        await showWarga();
      }

      else if (page === "pembayaran") {
        await showPembayaran();
      }

      else if (page === "laporan") {
        await showLaporan();
      }

      else if (page === "pengumuman") {
        await showPengumuman();
      }

      else if (page === "kegiatan") {
        showKegiatan();
      }

      else if (page === "pengurus") {
        await showPengurus();
      }

      else if (page === "nomor") {
        await showNomorPenting();
      }
