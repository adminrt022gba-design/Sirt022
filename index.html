<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIRT 022</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #1e293b;
    }

    .header {
      background: #0f766e;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .login-card {
      max-width: 430px;
      margin: 70px auto;
    }

    h2 {
      color: #0f766e;
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
    }

    .btn-red {
      background: #dc2626;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: #f0fdfa;
      padding: 18px;
      text-align: center;
      border-radius: 12px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: #0f766e;
    }

    .menu {
      width: 100%;
      padding: 18px 10px;
      border-radius: 12px;
      background: #f0fdfa;
      color: #115e59;
      font-size: 15px;
      font-weight: bold;
    }

    .menu:hover {
      background: #ccfbf1;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #f0fdfa;
      color: #115e59;
    }

    .lunas {
      color: #15803d;
      font-weight: bold;
    }

    .belum {
      color: #dc2626;
      font-weight: bold;
    }

    .back {
      margin-bottom: 12px;
      background: #64748b;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage">

  <div class="card login-card">

    <h2>Login SIRT 022</h2>

    <p style="margin-bottom:15px;">
      Sistem Informasi Rukun Tetangga 022
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="btn" onclick="login()">
      Masuk
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</section>


<!-- ================= PORTAL ================= -->

<section id="portalPage" class="hidden">

  <div class="header">

    <h1>SIRT 022</h1>

    <p>Sistem Informasi Rukun Tetangga 022</p>

  </div>


  <div class="container">


    <!-- REKAP -->

    <div class="card">

      <h2>Ringkasan Warga</h2>

      <div class="grid">

        <div class="stat">
          <strong id="totalWarga">0</strong>
          Total Warga
        </div>

        <div class="stat">
          <strong id="totalKK">0</strong>
          Total KK
        </div>

        <div class="stat">
          <strong id="totalLunas">0</strong>
          Sudah Lunas
        </div>

        <div class="stat">
          <strong id="totalBelum">0</strong>
          Belum Lunas
        </div>

      </div>

    </div>


    <!-- MENU -->

    <div class="card">

      <h2>Menu SIRT 022</h2>

      <div class="grid">

        <button class="menu" onclick="showWarga()">
          👥 Data Warga
        </button>

        <button class="menu" onclick="showPembayaran()">
          💰 Pembayaran Bulanan
        </button>

        <button class="menu" onclick="showLaporan()">
          📝 Laporan / Usulan
        </button>

        <button class="menu" onclick="showPengumuman()">
          📢 Pengumuman
        </button>

        <button class="menu" onclick="showPengurus()">
          👨‍💼 Pengurus RT
        </button>

        <button class="menu" onclick="showNomorPenting()">
          ☎️ Nomor Penting
        </button>

      </div>

    </div>


    <!-- CONTENT -->

    <div id="contentArea" class="card">

      <h2>Selamat Datang</h2>

      <p>
        Portal SIRT 022 siap digunakan.
      </p>

    </div>


    <button
      class="btn btn-red"
      onclick="logout()"
    >
      Keluar
    </button>

  </div>

</section>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


// ================= LOGIN =================

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.innerText =
      "Email dan password wajib diisi.";

    return;
  }

  message.innerText =
    "Sedang masuk...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.innerText =
      "Login gagal: " + error.message;

    return;
  }

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("portalPage")
    .classList.remove("hidden");

  await loadDashboard();

}


// ================= SESSION =================

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("portalPage")
      .classList.remove("hidden");

    await loadDashboard();

  }

}


// ================= DASHBOARD =================

async function loadDashboard() {

  const { data, error } =
    await supabaseClient
      .from("warga")
      .select("id,no_kk");

  if (error) {

    console.log(error);

    return;
  }

  document.getElementById("totalWarga")
    .innerText = data.length;

  const kk =
    new Set(
      data
        .map(w => w.no_kk)
        .filter(Boolean)
    );

  document.getElementById("totalKK")
    .innerText = kk.size;

  document.getElementById("totalLunas")
    .innerText = "0";

  document.getElementById("totalBelum")
    .innerText = "0";

}


// ================= DATA WARGA =================

async function showWarga() {

  const content =
    document.getElementById("contentArea");

  content.innerHTML = `

    <button
      class="btn back"
      onclick="loadHome()"
    >
      ← Kembali
    </button>

    <h2>👥 Data Warga</h2>

    <input
      id="inputKK"
      placeholder="No. KK"
    >

    <input
      id="inputNama"
      placeholder="Nama Lengkap"
    >

    <input
      id="inputBlok"
      placeholder="Blok"
    >

    <input
      id="inputGang"
      placeholder="Gang"
    >

    <button
      class="btn"
      onclick="tambahWarga()"
    >
      + Simpan Warga
    </button>

    <div id="wargaMessage" class="message"></div>

    <div
      id="wargaTable"
      class="table-wrap"
    >
      Memuat data...
    </div>
  `;

  await loadWarga();

}


// ================= LOAD WARGA =================

async function loadWarga() {

  const table =
    document.getElementById("wargaTable");

  if (!table) return;

  const { data, error } =
    await supabaseClient
      .from("warga")
      .select("*")
      .order("nama_lengkap");

  if (error) {

    table.innerHTML =
      "<p>Gagal mengambil data warga: "
      + error.message +
      "</p>";

    return;
  }

  if (!data.length) {

    table.innerHTML =
      "<p>Belum ada data warga.</p>";

    return;
  }

  let html = `

    <table>

      <thead>

        <tr>
          <th>No. KK</th>
          <th>Nama</th>
          <th>Blok</th>
          <th>Gang</th>
        </tr>

      </thead>

      <tbody>
  `;

  data.forEach(w => {

    html += `

      <tr>

        <td>${escapeHtml(w.no_kk || "-")}</td>

        <td>${escapeHtml(w.nama_lengkap || "-")}</td>

        <td>${escapeHtml(w.blok || "-")}</td>

        <td>${escapeHtml(w.gang || "-")}</td>

      </tr>

    `;

  });

  html += `
      </tbody>
    </table>
  `;

  table.innerHTML = html;

}


// ================= TAMBAH WARGA =================

async function tambahWarga() {

  const noKK =
    document.getElementById("inputKK").value.trim();

  const nama =
    document.getElementById("inputNama").value.trim();

  const blok =
    document.getElementById("inputBlok").value.trim();

  const gang =
    document.getElementById("inputGang").value.trim();

  const message =
    document.getElementById("wargaMessage");

  if (!nama) {

    message.innerText =
      "Nama warga wajib diisi.";

    return;
  }

  message.innerText =
    "Menyimpan...";

  const { error } =
    await supabaseClient
      .from("warga")
      .insert({
        no_kk: noKK || null,
        nama_lengkap: nama,
        blok: blok || null,
        gang: gang || null
      });

  if (error) {

    message.innerText =
      "Gagal: " + error.message;

    return;
  }

  message.innerText =
    "Data warga berhasil disimpan.";

  document.getElementById("inputKK").value = "";
  document.getElementById("inputNama").value = "";
  document.getElementById("inputBlok").value = "";
  document.getElementById("inputGang").value = "";

  await loadWarga();
  await loadDashboard();

}


// ================= PEMBAYARAN =================

async function showPembayaran() {

  const content =
    document.getElementById("contentArea");

  content.innerHTML = `

    <button
      class="btn back"
      onclick="loadHome()"
    >
      ← Kembali
    </button>

    <h2>💰 Pembayaran Bulanan</h2>

    <p>
      Fitur pembayaran bulanan warga.
    </p>

    <br>

    <p>
      Status: <b>Lunas</b> / <b>Belum Lunas</b>
    </p>

    <br>

    <p>
      Sistem pembayaran akan kita aktifkan
      setelah data warga pertama berhasil masuk.
    </p>
  `;

}


// ================= MENU LAIN =================

function showLaporan() {

  document.getElementById("contentArea").innerHTML = `

    <button
      class="btn back"
      onclick="loadHome()"
    >
      ← Kembali
    </button>

    <h2>📝 Laporan / Usulan Warga</h2>

    <p>
      Tempat warga menyampaikan laporan
      dan usulan kepada pengurus RT 022.
    </p>

  `;

}


function showPengumuman() {

  document.getElementById("contentArea").innerHTML = `

    <button
      class="btn back"
      onclick="loadHome()"
    >
      ← Kembali
    </button>

    <h2>📢 Pengumuman</h2>

    <p>
      Pengumuman RT 022 akan tampil di sini.
    </p>

  `;

}


function showPengurus() {

  document.getElementById("contentArea").innerHTML = `

    <button
      class="btn back"
      onclick="loadHome()"
    >
      ← Kembali
    </button>

    <h2>👨‍💼 Pengurus RT 022</h2>

    <p>
      Struktur pengurus RT akan kita masukkan
      pada tahap berikutnya.
    </p>

  `;

}


function showNomorPenting() {

  document.getElementById("contentArea").innerHTML = `

    <button
      class="btn back"
      onclick="loadHome()"
    >
      ← Kembali
    </button>

    <h2>☎️ Nomor Penting</h2>

    <p>🚑 Ambulance</p>
    <p>🔥 Pemadam Kebakaran</p>
    <p>⚡ PLN</p>
    <p>👮 Kepolisian</p>

  `;

}


// ================= HOME =================

function loadHome() {

  document.getElementById("contentArea").innerHTML = `

    <h2>Selamat Datang</h2>

    <p>
      Portal SIRT 022 siap digunakan.
    </p>

  `;

}


// ================= LOGOUT =================

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("portalPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


// ================= KEAMANAN TAMPILAN =================

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


// ================= MULAI =================

checkSession();

</script>

</body>
</html>
